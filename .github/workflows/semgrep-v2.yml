name: Semgrep-v2

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches: ["master", "main"]

permissions:
  security-events: write
  contents: read
  actions: read
  pull-requests: write

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    if: (github.actor != 'dependabot[bot]')

    steps:
      - uses: actions/checkout@v4

      # Génération JSON pour reviewdog
      - name: Run semgrep (JSON)
        run: |
          semgrep \
            --config=p/comment \
            --config=p/cwe-top-25 \
            --config=p/default \
            --config=p/owasp-top-ten \
            --config=p/r2c-security-audit \
            --config=p/secure-defaults \
            --config=p/javascript \
            --config=p/python \
            --config=p/react \
            --config=p/secrets \
            --config=p/docker-compose \
            --config=p/dockerfile \
            --config=p/bandit \
            --config=p/brakeman \
            --config=p/eslint \
            --config=p/gitleaks \
            --config=p/phpcs-security-audit \
            --config=p/security-code-scan \
            --json > semgrep.json

      - name: Upload Semgrep JSON report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep.json
          path: semgrep.json

      # Génération SARIF
      - name: Run semgrep (SARIF)
        run: |
          semgrep \
            --config=p/comment \
            --config=p/cwe-top-25 \
            --config=p/default \
            --config=p/owasp-top-ten \
            --config=p/r2c-security-audit \
            --config=p/secure-defaults \
            --config=p/javascript \
            --config=p/python \
            --config=p/react \
            --config=p/secrets \
            --config=p/docker-compose \
            --config=p/dockerfile \
            --config=p/bandit \
            --config=p/brakeman \
            --config=p/eslint \
            --config=p/gitleaks \
            --config=p/phpcs-security-audit \
            --config=p/security-code-scan \
            --sarif > semgrep.sarif

      # Patch des severities pour GitHub
      - name: Fix SARIF severities
        run: |
          sed -i 's/"info"/"0.0"/Ig' semgrep.sarif
          sed -i 's/"low"/"2.0"/Ig' semgrep.sarif
          sed -i 's/"medium"/"5.0"/Ig' semgrep.sarif
          sed -i 's/"high"/"8.0"/Ig' semgrep.sarif
          sed -i 's/"critical"/"9.5"/Ig' semgrep.sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()
