# Name of this GitHub Actions workflow.
name: Semgrep-v2

on:
  # Scan changed files in PRs (diff-aware scanning):
  pull_request: {}
  # Scan on-demand through GitHub Actions interface:
  workflow_dispatch: {}
  # Scan mainline branches and report all findings:
  push:
    branches: ["master", "main"]

permissions:
  # This permission is required when uploading sarifs to any repository at GitHub
  security-events: write
  # These permissions are only required when uploading sarifs to private and internal repositories at GitHub
  contents: read
  actions: read

jobs:
  semgrep:
    # User definable name of this GitHub Actions job.
    name: semgrep/ci
    # If you are self-hosting, change the following `runs-on` value:
    runs-on: ubuntu-latest

    container:
      # A Docker image with Semgrep installed. Do not change this.
      image: semgrep/semgrep

    # Skip any PR created by dependabot to avoid permission issues:
    if: (github.actor != 'dependabot[bot]')

    steps:
      # Fetch project source with GitHub Actions Checkout. Use either v3 or v4.
      - uses: actions/checkout@v4
      # Run the "semgrep ci" command on the command line of the docker image.
      - run: semgrep \
          --config p/comment \
          --config p/cwe-top-25 \
          --config p/default \
          --config p/owasp-top-ten \
          --config p/r2c-security-audit \
          --config p/secure-defaults \
          --config p/javascript \
          --config p/python \
          --config p/react \
          --config p/secrets \
          --config p/docker-compose \
          --config p/dockerfile \
          --config p/bandit \
          --config p/brakeman \
          --config p/eslint \
          --config p/gitleaks \
          --config p/phpcs-security-audit \
          --config p/security-code-scan \
          --sarif > semgrep.sarif

      - name: Upload SARIF file for GitHub Advanced Security Dashboard
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()
