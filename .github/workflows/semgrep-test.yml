name: Semgrep Code Scan

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  semgrep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep with strict rules (JSON + SARIF)
        run: |
          semgrep --config=p/ci \
                  --severity=ERROR \
                  --error \
                  --json > semgrep-results.json \
                  --sarif > semgrep-results.sarif || true

      # Upload JSON for manual download
      - name: Upload Semgrep JSON report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-json-report
          path: semgrep-results.json

      # Upload SARIF to GitHub Security
      - name: Upload Semgrep SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
