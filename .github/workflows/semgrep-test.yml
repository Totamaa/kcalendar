name: Semgrep Full Audit

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  semgrep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      # Toujours générer les rapports (même si findings)
      - name: Run Semgrep (JSON output)
        run: |
          semgrep \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --json > semgrep-results.json || true

      - name: Run Semgrep (SARIF output)
        run: |
          semgrep \
            --config=p/comment \
            --config=p/cwe-top-25 \
            --config=p/default \
            --config=p/owasp-top-ten \
            --config=p/r2c-security-audit \
            --config=p/secure-defaults \
            --config=p/javascript \
            --config=p/python \
            --config=p/react \
            --config=p/secrets \
            --config=p/docker-compose \
            --config=p/dockerfile \
            --config=p/bandit \
            --config=p/brakeman \
            --config=p/eslint \
            --config=p/gitleaks \
            --config=p/phpcs-security-audit \
            --config=p/security-code-scan \
            --sarif > semgrep-results.sarif || true

      - name: Upload Semgrep JSON report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-json-report
          path: semgrep-results.json

      - name: Upload Semgrep SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif

      # Étape séparée pour casser si findings
      - name: Fail if findings
        run: |
          semgrep \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --error
